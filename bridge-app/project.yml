name: AbductiveBridge

options:
  bundleIdPrefix: com.matthewgrimes
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  BridgeCore:
    path: BridgeCore

targets:
  AbductiveBridge:
    type: application
    platform: macOS
    sources:
      - path: AbductiveBridge
        excludes:
          - Info.plist
          - AbductiveBridge.entitlements
    dependencies:
      - package: BridgeCore
        product: BridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewgrimes.AbductiveBridge
        PRODUCT_NAME: "Abductive Bridge"
        INFOPLIST_FILE: AbductiveBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: AbductiveBridge/AbductiveBridge.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: 5
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: "" # set your own Apple team ID to sign
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        DEAD_CODE_STRIPPING: YES

schemes:
  AbductiveBridge:
    build:
      targets:
        AbductiveBridge: all
    run:
      config: Debug
